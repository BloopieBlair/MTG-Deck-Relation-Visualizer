<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MTG Deck Relation Visualizer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html { font-size: 62.5%; }
    body {
      font-family: 'Inter', sans-serif;
      overscroll-behavior: none;
      font-size: 1.6rem;
      background-color: black;
      color: #e5e7eb;
    }
    .tooltip {
      position: absolute;
      text-align: center;
      padding: 0.8rem;
      font: 1.2rem sans-serif;
      background: #1f2937;
      border: 1px solid #06b6d4;
      border-radius: 0.8rem;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
      color: #e5e7eb;
      z-index: 10;
    }
    .custom-scrollbar::-webkit-scrollbar { width: 0.8rem; height: 0.8rem; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #1f2937; border-radius: 1rem; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #0891b2; border-radius: 1rem; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #06b6d4; }
    .custom-scrollbar { scrollbar-width: thin; scrollbar-color: #0891b2 #1f2937; }
  </style>
</head>
<body class="bg-black text-gray-200">
  <div id="root"></div>
  <div class="tooltip" style="opacity: 0;"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
